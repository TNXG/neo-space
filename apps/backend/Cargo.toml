[package]
name = "neo-space-backend-axum"
version = "0.1.0"
edition = "2024"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "forbid"

[profile.dev]
incremental = true
codegen-units = 128
# 只保留行号表，链接更快、磁盘和峰值内存显著下降，堆栈仍可读
debug = "line-tables-only"
split-debuginfo = "unpacked"

# 依赖项一次性轻度优化、且不带调试信息：
# - 第三方 crate 不会被频繁修改，重载时不会重编它们
# - 省下大量 debuginfo 和增量缓存所占的磁盘 / 内存
# - 运行期速度也更接近 release，dev 体感更顺
[profile.dev.package."*"]
opt-level = 1
debug = false
codegen-units = 16

# 当前业务 crate 仍走最快的 debug，方便迭代
[profile.dev.package.neo-space-backend-axum]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
# Core web framework
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "http2",
  "tokio",
  "tower-log",
  "json",
  "query",
  "matched-path",
  "original-uri",
  "form",
  "macros",
  "multipart",
  "ws"
] }
axum-extra = { version = "0.12.6", default-features = false, features = [
  "cookie",
  "typed-header"
] }
tower = { version = "0.5.3", default-features = false, features = [ "util" ] }
tower-http = { version = "0.6.11", default-features = false, features = [
  "cors",
  "trace",
  "compression-br",
  "compression-gzip",
  "limit"
] }
tokio = { version = "1.52.3", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "io-util",
  "sync",
  "fs",
  "time"
] }

# Database
mongodb = { version = "3.7.0", features = [ "rustls-tls" ] }
bson = { version = "2.13", default-features = false, features = [ "chrono-0_4" ] }

# Serialization
serde = { version = "1.0.228", features = [ "derive" ], default-features = false }
serde_json = { version = "1.0.150", default-features = false, features = [ "std" ] }

# Auth
jsonwebtoken = { version = "10.4.0", default-features = false, features = [ "rust_crypto" ] }
# Passkey 服务端校验使用纯 Rust 加密实现，避免在构建和运行时依赖系统 OpenSSL。
passkey-auth = "0.1.3"
rustls = { version = "0.23.40", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12"
] }

# Async
futures = { version = "0.3.32", default-features = false, features = [ "std" ] }
async-trait = "0.1.89"
async-stream = "0.3.6"

# HTTP client
reqwest = { version = "0.13.3", default-features = false, features = [
  "json",
  "form",
  "rustls"
] }

# Utilities
chrono = { version = "0.4.45", default-features = false, features = [
  "serde",
  "clock",
  "std"
] }
urlencoding = "2.1.3"
html-escape = "0.2.13"
dotenv = "0.15.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = { version = "0.4.3", default-features = false, features = [ "alloc" ] }
uuid = { version = "1.23.3", default-features = false, features = [ "v4" ] }
rand = { version = "0.10.1", default-features = false, features = [
  "std",
  "std_rng",
  "thread_rng"
] }
md5 = { version = "0.8.0", default-features = false }

# Bangumi 动漫头像检测；关闭绘图和桌面预览，仅保留 ONNX 推理核心。
ultralytics-inference = {
  git = "https://github.com/TNXGLab/inference",
  rev = "9b581834645776b16deec994cc3490bce72f7d47",
  default-features = false
}
# Alpine 通过 pkg-config 链接原生 musl ONNX Runtime，避免 ort 尝试下载不存在的 musl 预构建包。
ort = { version = "=2.0.0-rc.13", default-features = false, features = [ "pkg-config" ] }
image = { version = "0.25.10", default-features = false, features = [ "jpeg", "png", "webp" ] }

# Cache
moka = { version = "0.12.15", default-features = false, features = [ "future" ] }
arc-swap = "1.7.1"

# OpenAPI
utoipa = { version = "5.5.0", features = [
  "axum_extras",
  "chrono",
  "uuid"
] }
utoipa-swagger-ui = { version = "9.0.2", features = [
  "axum",
  "vendored"
] }

# Email
lettre = { version = "0.11.22", default-features = false, features = [
  "tokio1-rustls-tls",
  "smtp-transport",
  "builder",
  "hostname"
] }

# Meilisearch — tls feature (uses rustls internally)
meilisearch-sdk = { version = "0.33.0", default-features = false, features = [ "tls" ] }

# OpenAI — rustls backend
async-openai = { version = "0.41.0", default-features = false, features = [ "rustls" ] }

# Stream utilities
tokio-stream = { version = "0.1.18", default-features = false, features = [ "time" ] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi"
] }
aes = { version = "0.9.1", default-features = false }
ecb = { version = "0.2.0", default-features = false, features = [ "alloc" ] }
cipher = { version = "0.5.2", default-features = false, features = [ "block-padding" ] }


# 用于将 admin 控制面板构建产物打包进可执行文件
rust-embed = { version = "8.11.0", default-features = false, features = [ "include-exclude" ] }
mime_guess = { version = "2.0.5", default-features = false }
bcrypt = "0.19.1"
