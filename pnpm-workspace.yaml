shellEmulator: true

trustPolicy: no-downgrade

packages:
  - apps/*
  - packages/*

packageExtensions:
  "@hookform/resolvers@*":
    peerDependencies:
      zod: "^3.25 || ^4.0"
    peerDependenciesMeta:
      zod:
        optional: true

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  exifreader: true
  sharp: true
  vue-demi: true

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - "langium@3.3.1"

