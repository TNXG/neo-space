[package]
name = "neo-space-backend-axum"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
indexing_slicing = "forbid"

[dependencies]
# Core web framework
axum = { version = "0.8.8", features = [
  "macros",
  "multipart",
  "ws"
] }
axum-extra = { version = "0.12.5", features = [
  "cookie",
  "typed-header"
] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = [
  "cors",
  "trace",
  "compression-br",
  "compression-gzip",
  "limit"
] }
tokio = { version = "1.50.0", features = [ "full" ] }

# Database
mongodb = "3.5.1"
bson = { version = "2.13", features = [ "chrono-0_4" ] }

# Serialization
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"

# Auth
jsonwebtoken = "10.3.0"

# Async
futures = "0.3.32"
async-trait = "0.1.89"
async-stream = "0.3.6"

# HTTP client
reqwest = { version = "0.13.2", features = [
  "json",
  "form",
  "rustls"
] }

# Utilities
chrono = { version = "0.4.44", features = [ "serde" ] }
urlencoding = "2.1.3"
html-escape = "0.2.13"
dotenv = "0.15.0"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.22.0", features = [ "v4" ] }
rand = "0.10.0"
md5 = "0.8.0"

# Cache
moka = { version = "0.12.14", features = [ "future" ] }

# OpenAPI
utoipa = { version = "5.4.0", features = [
  "axum_extras",
  "chrono",
  "uuid"
] }
utoipa-swagger-ui = { version = "9.0.2", features = [
  "axum",
  "vendored"
] }

# Email
lettre = { version = "0.11", default-features = false, features = [
  "tokio1-rustls-tls",
  "smtp-transport",
  "builder",
  "hostname"
] }

# Meilisearch
meilisearch-sdk = "0.32.0"

# OpenAI
async-openai = "0.33.0"

# Stream utilities
tokio-stream = "0.1.18"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [ "env-filter" ] }
