[package]
name = "neo-space-backend-axum"
version = "0.1.0"
edition = "2024"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "forbid"

[profile.dev]
incremental = true
codegen-units = 128
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
# Core web framework
axum = { version = "0.8.8", default-features = false, features = [
  "http1",
  "http2",
  "tokio",
  "tower-log",
  "json",
  "query",
  "matched-path",
  "original-uri",
  "form",
  "macros",
  "multipart",
  "ws"
] }
axum-extra = { version = "0.12.5", default-features = false, features = [
  "cookie",
  "typed-header"
] }
tower = { version = "0.5.3", default-features = false, features = [ "util" ] }
tower-http = { version = "0.6.8", default-features = false, features = [
  "cors",
  "trace",
  "compression-br",
  "compression-gzip",
  "limit"
] }
tokio = { version = "1.50.0", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "io-util",
  "sync",
  "fs",
  "time"
] }

# Database
mongodb = { version = "3.5.1", features = [ "rustls-tls" ] }
bson = { version = "2.13", default-features = false, features = [ "chrono-0_4" ] }

# Serialization
serde = { version = "1.0.228", features = [ "derive" ], default-features = false }
serde_json = { version = "1.0.149", default-features = false, features = [ "std" ] }

# Auth
jsonwebtoken = { version = "10.3.0", default-features = false, features = [ "rust_crypto" ] }
rustls = { version = "0.23.37", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12"
] }

# Async
futures = { version = "0.3.32", default-features = false, features = [ "std" ] }
async-trait = "0.1.89"
async-stream = "0.3.6"

# HTTP client
reqwest = { version = "0.13.2", default-features = false, features = [
  "json",
  "form",
  "rustls"
] }

# Utilities
chrono = { version = "0.4.44", default-features = false, features = [
  "serde",
  "clock",
  "std"
] }
urlencoding = "2.1.3"
html-escape = "0.2.13"
dotenv = "0.15.0"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = { version = "0.4.3", default-features = false, features = [ "alloc" ] }
uuid = { version = "1.22.0", default-features = false, features = [ "v4" ] }
rand = { version = "0.10.0", default-features = false, features = [
  "std",
  "std_rng",
  "thread_rng"
] }
md5 = { version = "0.8.0", default-features = false }

# Cache
moka = { version = "0.12.14", default-features = false, features = [ "future" ] }

# OpenAPI
utoipa = { version = "5.4.0", features = [
  "axum_extras",
  "chrono",
  "uuid"
] }
utoipa-swagger-ui = { version = "9.0.2", features = [
  "axum",
  "vendored"
] }

# Email
lettre = { version = "0.11", default-features = false, features = [
  "tokio1-rustls-tls",
  "smtp-transport",
  "builder",
  "hostname"
] }

# Meilisearch — tls feature (uses rustls internally)
meilisearch-sdk = { version = "0.32.0", default-features = false, features = [ "tls" ] }

# OpenAI — rustls backend
async-openai = { version = "0.33.1", default-features = false, features = [ "rustls" ] }

# Stream utilities
tokio-stream = { version = "0.1.18", default-features = false, features = [ "time" ] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi"
] }
aes = { version = "0.8.4", default-features = false }
ecb = { version = "0.1.2", default-features = false, features = [ "alloc" ] }
cipher = { version = "0.4", default-features = false, features = [ "block-padding" ] }
