name: Build Backend Docker Image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "apps/admin/**"
      - "apps/backend/**"
      - "packages/rich-react/**"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/docker-backend.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend
  BINARY_NAME: neo-space-backend-axum

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin dashboard
        run: pnpm build:admin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/backend -> target
          cache-on-failure: true

      - name: Build musl binary in Alpine
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          build_status=0
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --volume "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            --volume "$HOME/.cargo/git:/usr/local/cargo/git" \
            --workdir /workspace/apps/backend \
            rust:1.97.1-alpine3.23 \
            sh -euxc '
              apk add --no-cache build-base nasm onnxruntime-dev pkgconf
              cargo build --locked --release
            ' || build_status=$?
          sudo chown -R "$(id -u):$(id -g)" \
            apps/backend/target \
            "$HOME/.cargo/registry" \
            "$HOME/.cargo/git"
          exit "$build_status"

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp apps/backend/target/release/${{ env.BINARY_NAME }} dist/
          chmod +x dist/${{ env.BINARY_NAME }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-x86_64-musl
          path: dist/${{ env.BINARY_NAME }}
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: dist
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
