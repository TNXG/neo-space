name: Build Backend Docker Image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "apps/admin/**"
      - "apps/backend/**"
      - "packages/rich-react/**"
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/docker-backend.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend
  BINARY_NAME: neo-space-backend-axum

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin dashboard
        run: pnpm build:admin

      - name: Install musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools nasm

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/backend -> target
          cache-on-failure: true

      - name: Export Alpine ONNX Runtime libraries
        run: |
          onnxruntime_lib_path="$RUNNER_TEMP/onnxruntime-musl"
          mkdir -p "$onnxruntime_lib_path"
          docker run --rm \
            --volume "$onnxruntime_lib_path:/export" \
            alpine:3.23 \
            sh -euxc '
              apk add --no-cache onnxruntime-dev
              cp -a /usr/lib/. /export/
            '
          sudo chown -R "$(id -u):$(id -g)" "$onnxruntime_lib_path"
          echo "ORT_LIB_PATH=$onnxruntime_lib_path" >> "$GITHUB_ENV"

      - name: Build binary
        working-directory: apps/backend
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
          ORT_PREFER_DYNAMIC_LINK: "1"
        run: |
          export RUSTFLAGS="-C target-feature=-crt-static -C link-arg=-Wl,-rpath-link=$ORT_LIB_PATH"
          cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp apps/backend/target/x86_64-unknown-linux-musl/release/${{ env.BINARY_NAME }} dist/
          chmod +x dist/${{ env.BINARY_NAME }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-x86_64-musl
          path: dist/${{ env.BINARY_NAME }}
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: dist
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
